<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Widget</title>
  <style>
    /* ============================================================
       CSS — Chat Widget
       Design: premium dark luxury theme matching Noir & Gold
       ============================================================ */

    #chat-widget {
      --cw-primary: #C9A84C;
      --cw-primary-dark: #B8963F;
      --cw-user-bubble: #C9A84C;
      --cw-user-text: #0d0d0d;
      --cw-bot-bubble: #1e1e1e;
      --cw-bot-text: #e0e0e0;
      --cw-error-bubble: rgba(231, 76, 60, 0.12);
      --cw-error-text: #e74c3c;
      --cw-header-bg: #161616;
      --cw-header-border: #C9A84C;
      --cw-header-text: #ffffff;
      --cw-input-bg: #1a1a1a;
      --cw-border: #2a2a2a;
      --cw-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      --cw-radius: 14px;
      --cw-typing-dot: #666;

      position: fixed;
      bottom: 0;
      right: 0;
      z-index: 99999;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* --- FAB --- */
    .cw-fab {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: var(--cw-primary);
      color: #0d0d0d;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(201, 168, 76, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      z-index: 2;
    }

    .cw-fab:hover {
      transform: scale(1.07);
      background: var(--cw-primary-hover);
      box-shadow: 0 6px 24px rgba(201, 168, 76, 0.45);
    }

    .cw-fab:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .cw-fab svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: #0d0d0d;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: opacity 0.15s;
    }

    .cw-widget--open .cw-fab .cw-icon-chat { display: none; }
    .cw-fab .cw-icon-close { display: none; }
    .cw-widget--open .cw-fab .cw-icon-close { display: block; }

    /* --- Panel --- */
    .cw-panel {
      position: absolute;
      bottom: 96px;
      right: 24px;
      width: 380px;
      height: 500px;
      background: #161616;
      border-radius: var(--cw-radius);
      box-shadow: var(--cw-shadow);
      border: 1px solid var(--cw-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px) scale(0.96);
      transform-origin: bottom right;
      transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
    }

    .cw-widget--open .cw-panel {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    /* --- Header --- */
    .cw-header {
      background: var(--cw-header-bg);
      color: var(--cw-header-text);
      padding: 1rem 1.15rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      border-bottom: 2px solid var(--cw-header-border);
    }

    .cw-header__title {
      margin: 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.03em;
    }

    .cw-header__close {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .cw-header__close:hover {
      background: rgba(201, 168, 76, 0.15);
      color: var(--cw-primary);
    }

    .cw-header__close:focus-visible {
      outline: 2px solid var(--cw-primary);
      outline-offset: 2px;
    }

    .cw-header__close svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
    }

    /* --- Message List --- */
    .cw-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      scroll-behavior: smooth;
    }

    /* --- Message Bubbles --- */
    .cw-msg {
      max-width: 82%;
      padding: 0.65rem 0.9rem;
      border-radius: 16px;
      font-size: 0.88rem;
      line-height: 1.5;
      word-wrap: break-word;
      animation: cw-fadeIn 0.2s ease;
    }

    @keyframes cw-fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cw-msg--user {
      align-self: flex-end;
      background: var(--cw-user-bubble);
      color: var(--cw-user-text);
      border-bottom-right-radius: 4px;
    }

    .cw-msg--bot {
      align-self: flex-start;
      background: var(--cw-bot-bubble);
      color: var(--cw-bot-text);
      border-bottom-left-radius: 4px;
    }

    .cw-msg--error {
      align-self: center;
      background: var(--cw-error-bubble);
      color: var(--cw-error-text);
      border-radius: 10px;
      text-align: center;
      font-size: 0.84rem;
    }

    /* --- Typing Indicator --- */
    .cw-typing {
      align-self: flex-start;
      display: none;
      padding: 0.7rem 1rem;
      background: var(--cw-bot-bubble);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }

    .cw-typing--visible {
      display: flex;
      gap: 5px;
    }

    .cw-typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cw-typing-dot);
      animation: cw-bounce 1.2s infinite ease-in-out;
    }

    .cw-typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .cw-typing-dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes cw-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* --- Input Area --- */
    .cw-input-area {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 0.8rem;
      border-top: 1px solid var(--cw-border);
      background: var(--cw-input-bg);
      flex-shrink: 0;
    }

    .cw-input {
      flex: 1;
      padding: 0.6rem 0.9rem;
      border: 1px solid var(--cw-border);
      border-radius: 24px;
      font-size: 0.88rem;
      font-family: inherit;
      color: var(--cw-bot-text);
      background: #1e1e1e;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .cw-input:focus {
      border-color: var(--cw-primary);
      box-shadow: 0 0 0 2px rgba(201, 168, 76, 0.12);
    }

    .cw-input::placeholder {
      color: #555;
    }

    .cw-send {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--cw-primary);
      color: #0d0d0d;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, opacity 0.2s, transform 0.15s;
    }

    .cw-send:hover:not(:disabled) {
      background: var(--cw-primary-dark);
      transform: scale(1.05);
    }

    .cw-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .cw-send:focus-visible {
      outline: 2px solid var(--cw-primary);
      outline-offset: 2px;
    }

    .cw-send svg {
      width: 18px;
      height: 18px;
      stroke: #0d0d0d;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* --- Mobile --- */
    @media (max-width: 480px) {
      .cw-fab {
        bottom: 16px;
        right: 16px;
        width: 56px;
        height: 56px;
      }

      .cw-panel {
        width: calc(100vw - 16px);
        height: calc(100vh - 100px);
        bottom: 80px;
        right: 8px;
        border-radius: var(--cw-radius);
      }

      .cw-widget--open .cw-panel {
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>

<div id="chat-widget" role="region" aria-label="Live chat">

  <button class="cw-fab" id="cw-fab" aria-label="Open chat" aria-expanded="false" aria-controls="cw-panel">
    <svg class="cw-icon-chat" viewBox="0 0 24 24">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
    <svg class="cw-icon-close" viewBox="0 0 24 24">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>

  <div class="cw-panel" id="cw-panel" role="dialog" aria-label="Chat window">
    <div class="cw-header">
      <h2 class="cw-header__title">Chat with us</h2>
      <button class="cw-header__close" id="cw-close" aria-label="Close chat">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="cw-messages" id="cw-messages" role="log" aria-live="polite" aria-atomic="false"></div>

    <div class="cw-typing" id="cw-typing" aria-hidden="true">
      <span class="cw-typing-dot"></span>
      <span class="cw-typing-dot"></span>
      <span class="cw-typing-dot"></span>
    </div>

    <div class="cw-input-area">
      <input type="text" class="cw-input" id="cw-input" placeholder="Type a message…" autocomplete="off" aria-label="Chat message input" />
      <button class="cw-send" id="cw-send" aria-label="Send message">
        <svg viewBox="0 0 24 24">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var WEBHOOK_URL = "REPLACE_WITH_CHAT_WEBHOOK_URL";
  function generateSessionId() {
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0;
      var v = c === "x" ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }
  var sessionId = generateSessionId();
  var widget = document.getElementById("chat-widget");
  var fab = document.getElementById("cw-fab");
  var closeBtn = document.getElementById("cw-close");
  var panel = document.getElementById("cw-panel");
  var messages = document.getElementById("cw-messages");
  var input = document.getElementById("cw-input");
  var sendBtn = document.getElementById("cw-send");
  var typingEl = document.getElementById("cw-typing");
  var isOpen = false;

  function openWidget() {
    isOpen = true;
    widget.classList.add("cw-widget--open");
    fab.setAttribute("aria-expanded", "true");
    fab.setAttribute("aria-label", "Close chat");
    input.focus();
  }
  function closeWidget() {
    isOpen = false;
    widget.classList.remove("cw-widget--open");
    fab.setAttribute("aria-expanded", "false");
    fab.setAttribute("aria-label", "Open chat");
    fab.focus();
  }
  function toggleWidget() { isOpen ? closeWidget() : openWidget(); }

  fab.addEventListener("click", toggleWidget);
  closeBtn.addEventListener("click", closeWidget);

  function appendMessage(text, type) {
    var div = document.createElement("div");
    div.className = "cw-msg cw-msg--" + type;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }
  function showTyping() { typingEl.classList.add("cw-typing--visible"); messages.scrollTop = messages.scrollHeight; }
  function hideTyping() { typingEl.classList.remove("cw-typing--visible"); }

  function sendMessage() {
    var text = input.value.trim();
    if (!text) return;
    sendBtn.disabled = true;
    input.value = "";
    appendMessage(text, "user");
    showTyping();
    fetch(WEBHOOK_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chatInput: text, sessionId: sessionId }) })
      .then(function (res) { if (!res.ok) throw new Error("Server returned " + res.status); return res.json(); })
      .then(function (data) {
        hideTyping();
        var reply = (data && data.reply) ? data.reply : "Thanks for your message!";
        appendMessage(reply, "bot");
      })
      .catch(function () {
        hideTyping();
        appendMessage("Something went wrong, please try again", "error");
      })
      .finally(function () { sendBtn.disabled = false; input.focus(); });
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); sendMessage(); } });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && isOpen) closeWidget(); });
})();
</script>
</body>
</html>
