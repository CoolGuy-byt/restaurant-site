    <style>
      /* Critical inlined styles to prevent white flash before CSS loads */
      :root{--color-cream:#FDF6EE;--color-espresso:#2C1810}
      html,body,#root{background:var(--color-cream);color:var(--color-espresso);height:100%;min-height:100vh}
      img{display:block;max-width:100%}
      img[data-loaded="false"]{opacity:0;transition:opacity 240ms ease-in-out}
      .marquee-section{visibility:hidden}
    </style>

  </head>
